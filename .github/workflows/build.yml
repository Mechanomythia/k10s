name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Publish a release with this version (e.g. 0.1.0). GitHub creates the tag vX.Y.Z on this commit. Leave empty for a plain build."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  go:
    name: Go tests (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - name: Cross-compile darwin
        run: GOOS=darwin GOARCH=arm64 go build ./... && GOOS=darwin GOARCH=amd64 go build ./...

  macos:
    name: macOS app
    runs-on: macos-15
    needs: go
    env:
      # Signing + notarization run only when these secrets exist; otherwise
      # the app is ad-hoc signed as before. See docs/notarization.md.
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_KEY_P8 != '' }}
      HAS_SPARKLE: ${{ secrets.SPARKLE_ED_PRIVATE_KEY != '' }}
      VERSION: ${{ (github.event_name == 'workflow_dispatch' && inputs.release_version != '') && inputs.release_version || format('0.1.1-dev.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go tests (darwin)
        run: go test ./...
      - name: Swift tests
        run: swift test
        working-directory: macos/K10s

      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          # The .p12 holds only your certificate + key; codesign also needs Apple's
          # Developer ID G2 intermediate to build the chain to the Apple root.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN" || true
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          test -n "$IDENTITY" || { echo "no 'Developer ID Application' identity in the .p12"; exit 1; }
          echo "Signing as: $IDENTITY"
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build K10s.app
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          VERSION="${VERSION#v}" macos/K10s/build-app.sh

      - name: Notarize and staple
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          V="${VERSION#v}"
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$NOTARY_KEY_P8" > "$KEY"
          # Submit the zip, wait for Apple's verdict (usually 1-10 min).
          xcrun notarytool submit "dist/K10s-$V.zip" \
            --key "$KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --wait --timeout 30m --output-format json | tee "$RUNNER_TEMP/notary.json"
          STATUS=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['status'])" "$RUNNER_TEMP/notary.json")
          if [ "$STATUS" != "Accepted" ]; then
            ID=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['id'])" "$RUNNER_TEMP/notary.json")
            xcrun notarytool log "$ID" --key "$KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
            exit 1
          fi
          # Staple the ticket to the app (a zip can't be stapled), then re-zip.
          xcrun stapler staple dist/K10s.app
          xcrun stapler validate dist/K10s.app
          rm "dist/K10s-$V.zip"
          (cd dist && ditto -c -k --keepParent K10s.app "K10s-$V.zip")
          spctl --assess --type execute -vv dist/K10s.app
          rm -f "$KEY"

      - name: Sparkle appcast (signed update feed)
        if: env.HAS_SPARKLE == 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          V="${VERSION#v}"
          # Signs the final (stapled) zip; the URL is where the release job publishes it.
          go run ./cmd/k10s-release appcast --version "$V" \
            --url "https://github.com/${{ github.repository }}/releases/download/v$V/K10s-$V.zip" \
            --notes "https://github.com/${{ github.repository }}/releases/tag/v$V" \
            --file "dist/K10s-$V.zip" --out dist/appcast.xml
          cat dist/appcast.xml

      - name: Smoke test
        run: |
          test -x dist/K10s.app/Contents/Resources/bin/k10s-engine
          lipo -archs dist/K10s.app/Contents/Resources/bin/k10s-engine | grep -q arm64
          lipo -archs dist/K10s.app/Contents/Resources/bin/k10s-engine | grep -q x86_64
          lipo -archs dist/K10s.app/Contents/MacOS/K10s | grep -q arm64
          lipo -archs dist/K10s.app/Contents/MacOS/K10s | grep -q x86_64
          test -d dist/K10s.app/Contents/Frameworks/Sparkle.framework
          /usr/libexec/PlistBuddy -c "Print :SUPublicEDKey" dist/K10s.app/Contents/Info.plist || echo "(auto-update disabled in this build)"
          codesign -dv --verbose=2 dist/K10s.app 2>&1 | grep -E "Authority|TeamIdentifier|flags" || true

      - name: Remove signing keychain
        if: always() && env.HAS_SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - uses: actions/upload-artifact@v4
        with:
          name: K10s-macOS
          path: |
            dist/K10s-*.zip
            dist/appcast.xml
          if-no-files-found: error

  release:
    name: Release
    if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
    needs: macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: K10s-macOS
      - uses: softprops/action-gh-release@v2
        with:
          # Creates vX.Y.Z on this commit.
          tag_name: ${{ format('v{0}', inputs.release_version) }}
          target_commitish: ${{ github.sha }}
          name: ${{ format('K10s {0}', inputs.release_version) }}
          files: |
            K10s-*.zip
            appcast.xml
          generate_release_notes: true
